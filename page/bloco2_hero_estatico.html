<style>
html,body{overflow-x:hidden;overflow-x:clip}
.ml-column:has(#gx-hero){min-width:0}

.gx-hero__line{font-size:clamp(10px,.82vw,12px);line-height:1.7;font-weight:400;max-width:62em;margin-top:clamp(16px,2.6vw,38px)}
.gx-hero__pres{font-size:clamp(9px,.72vw,11px);font-weight:500;margin-top:clamp(18px,2.6vw,40px)}

<script>
(function(){var d=document.documentElement;function s(){var x=d.clientWidth;d.style.setProperty('--ml-safe-vw',x+'px');d.style.setProperty('--ml-safe-half',x/2+'px')}s();addEventListener('resize',s,{passive:true})})();
